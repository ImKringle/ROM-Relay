# ROM Relay configuration (non-secret settings).
# Copy to config.ini in the config directory and edit. Secrets (tokens, passwords,
# IGDB credentials) go in .env instead, see .env.example. Every setting below
# shows its default; delete a line to accept the default. Relative paths resolve
# against this file's directory.

[library]
directory = platforms
# database_path: SQLite catalog file. Ignored when DATABASE_URL (PostgreSQL) is
# set in .env.
database_path = romrelay.db
scan_interval_hours = 1
metadata_refresh_days = 30
existing_output = skip
# ui_theme: "default" (dark blue, clean copy) or "corn" (harvest gold, corn
# vocabulary). Same layout and features either way.
ui_theme = default

[server]
listen_address = 0.0.0.0
port = 8080
# advertise_ip: address printed in QR/download URLs. Blank = auto-detect the LAN
# adapter. Set this when auto-detection is ambiguous.
advertise_ip =
# advertise_port: 0 mirrors the listen port.
advertise_port = 0
# public_base_url: absolute http(s) URL when served behind a reverse proxy.
public_base_url =
# The remote access (viewer) token is a secret: set REMOTE_ACCESS_TOKEN in .env.

[metadata.libretro]
enabled = true
database_directory = metadata/libretro/databases
thumbnail_directory = metadata/libretro/thumbnails
auto_update = true
download_thumbnails = true

[metadata.igdb]
enabled = false
# IGDB_CLIENT_ID and IGDB_CLIENT_SECRET are secrets: set them in .env.

[metadata.pokeapi]
# Fills the Pokédex with species detail, evolution requirements, and wild
# encounters. Reads the PokeAPI api-data checkout on disk when present (the
# third_party/api-data submodule, fully offline); falls back to pokeapi.co.
enabled = false
# data_directory: an api-data endpoint tree (…/data/api/v2). Relative paths
# resolve against this file's directory.
data_directory = third_party/api-data/data/api/v2

[remote_search]
enabled = false
host =
port = 22
username =
root_directory = /
host_key_sha256 =
max_results = 200
max_file_size_mb = 4096
# REMOTE_SEARCH_PASSWORD is a secret: set it in .env.

# Optional: override remote directory names per platform. When this section is
# present it fully replaces the built-in defaults, so list every platform you use.
# [remote_search.platforms]
# gb = gb
# gbc = gbc
# gba = gba
# nds = nds
# 3ds = 3ds
# nes = nes
# snes = snes
# n64 = n64
# genesis = genesis

[romm]
# Base URL of a RomM instance (e.g. http://romm:8080). With ROMM_TOKEN set in
# .env, signed-in users can search its library on the RomM page and grab
# single-platform ROMs. Grabs are temporary (<library>/external/romm, 7 days)
# unless an admin ticks "Retain". ROMM_URL in .env overrides this.
url =

[torrent]
# Torrents: an admin uploads .torrent sources (Admin > Torrent Sources); any
# signed-in user browses them on the Torrents page and grabs single games.
# Grabs never seed: each torrent has a zero share ratio and is removed from
# qBittorrent (files kept) the moment its file finishes. While downloading it
# trades pieces normally, which BitTorrent peers require for decent speed. Grabs are temporary
# (<library>/external/torrent, pruned after 7 days like patch output) unless an
# admin ticks "Retain" or later clicks "Keep". .zip grabs unzip automatically
# when they hold only ROMs plus .txt/.nfo, otherwise they wait for review.
# New ROMs are hashed and matched against libretro/IGDB like any library file.
enabled = false
# Blank = ROM Relay starts and stops its own private qBittorrent
# (qbittorrent-nox on PATH, or qbittorrent_path), bound to 127.0.0.1 on a free
# port with a random per-launch password. Set a URL to use an existing
# instance instead (the Docker stack sets QBITTORRENT_URL to its sidecar).
qbittorrent_url =
qbittorrent_path =
# username / QBITTORRENT_PASSWORD (.env): only for an external qbittorrent_url.
username =
# save_path: the library directory as an external qBittorrent sees it, when it
# runs on another host or container with different paths. Blank = [library]
# directory.
save_path =
# directory: where uploaded .torrent sources are stored.
directory = torrents

[storage]
# save_directory: users' uploaded game saves (Save Data / Living Dex uploads).
# Only save metadata is kept in the database, so back this directory up too.
save_directory = storage/saves

[webdav]
# Read-only /webdav/ catalog listing for clients that import ROMs via a
# WebDAV "cloud drive" (e.g. a phone emulator's built-in import source).
# Off by default. Each user still needs their own WebDAV key, minted from
# Account > WebDAV Access, regardless of this flag.
enabled = false

[patching]
enabled = true
patch_directory = patches
output_directory = patched
retention_hours = 24
max_rom_size_mb = 512
max_patch_size_mb = 64
timeout_seconds = 120
# The admin access token is a secret: set ADMIN_ACCESS_TOKEN in .env.

[randomizer]
# Requires the randomizer sidecar (RANDOMIZER_SIDECAR_URL in .env, or
# sidecar_url below); the tool is disabled entirely without it.
output_directory = randomized
retention_hours = 24
max_rom_size_mb = 512
timeout_seconds = 300
# sidecar_url = http://randomizer:8083
