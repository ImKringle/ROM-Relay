# ROM Relay container defaults, baked into the image as /app/config.ini.
# To customize: copy this file to config.ini (gitignored) and edit it; a
# config.ini in the repo root replaces this file at build time. Rebuild with
# `docker compose up -d --build` after editing either file.
# All data lives under /app/data (mounted volumes). Secrets (tokens,
# DATABASE_URL, IGDB, SFTP, RomM) come from .env, see .env.example.

[library]
directory = /app/data/roms
# Used only when DATABASE_URL is not set (SQLite fallback).
database_path = /app/data/database/romrelay.db
scan_interval_hours = 1
metadata_refresh_days = 30
existing_output = skip
# "default" (dark blue, clean copy) or "corn" (harvest gold, corn vocabulary).
ui_theme = default

[server]
listen_address = 0.0.0.0
port = 8080
# Set PUBLIC_BASE_URL (or ADVERTISE_IP) in .env instead; without one the
# container advertises its own unreachable compose-network IP.
advertise_ip =
advertise_port = 0
public_base_url =

[metadata.libretro]
enabled = true
database_directory = /app/data/metadata/libretro/databases
thumbnail_directory = /app/data/metadata/libretro/thumbnails
auto_update = true
download_thumbnails = true

[metadata.igdb]
# Needs IGDB_CLIENT_ID / IGDB_CLIENT_SECRET in .env.
enabled = false

[metadata.pokeapi]
# Reads the bind-mounted third_party/api-data submodule (offline); falls back
# to pokeapi.co when it is missing.
enabled = true
data_directory = /app/third_party/api-data/data/api/v2

[remote_search]
enabled = false
host =
port = 22
username =
root_directory = /
host_key_sha256 =
max_results = 200
max_file_size_mb = 4096

[romm]
# Or set ROMM_URL in .env (wins over this). Needs ROMM_TOKEN in .env.
url =

[torrent]
# The compose stack sets QBITTORRENT_URL to the qbittorrent sidecar, which
# switches torrents on. Uploaded .torrent sources live on the storage volume.
directory = /app/data/storage/torrents

[storage]
# Users' uploaded game saves. Only metadata goes in the database, so back
# this volume up too.
save_directory = /app/data/storage/saves

[webdav]
# Read-only /webdav/ catalog for emulator "cloud drive" imports. Each user
# also needs a key from Account > WebDAV Access.
enabled = false

[patching]
enabled = true
patch_directory = /app/data/patches
output_directory = /app/data/patched
retention_hours = 24
max_rom_size_mb = 512
max_patch_size_mb = 64
timeout_seconds = 120

[randomizer]
output_directory = /app/data/randomized
retention_hours = 24
max_rom_size_mb = 512
timeout_seconds = 300
